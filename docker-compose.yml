# version: '3.8'

services:
  # Reverse Proxy
  nginx:
    image: docker.arvancloud.ir/nginx:alpine
    container_name: ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - open-webui
      - api
    restart: unless-stopped
    networks:
      - ai-network


  # Open WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-webui
    ports:
      - "8080:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - SCRF_TRUSTED_ORIGINS=http://localhost,http://ai-assistant.company.local
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - ENABLE_ADMIN_EXPORT=true
      - PDF_EXTRACT_IMAGES=true
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ai-network

  # FastAPI Backend
  api:
    build: ./api
    container_name: ai-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - shared-data:/app/data
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - CHROMA_HOST=chromadb
      - REDIS_HOST=redis
      - DATABASE_URL=${DATABASE_URL}
      - ORACLE_DSN=${ORACLE_DSN}
    depends_on:
      - chromadb
      - redis
      - ollama
    restart: unless-stopped
    networks:
      - ai-network

  # ChromaDB Vector Database
  chromadb:
    image: docker.arvancloud.ir/chromadb/chroma:latest
    container_name: ai-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - ai-network

  # Redis Cache
  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - ai-network

  # postgres Database 
  postgres:
    image: postgres:16-alpine
    networks: 
      - ai-network
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama LLM Server
  ollama:
    image: docker.arvancloud.ir/ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_NUM_PARALLEL=4           # Allow multiple parallel requests
      - OLLAMA_MAX_LOADED_MODELS=2      # Keep multiple models in memory
      - OLLAMA_FLASH_ATTENTION=true     # Enable flash attention for better performance
      - OLLAMA_NUM_GPU=1                # Explicitly set GPU count
      - OLLAMA_GPU_OVERHEAD=0           # Minimize GPU overhead
    # deploy: {}
    # device_requests:
    #   - driver: nvidia
    #     count: -1         # -1 or "all" means all GPUs; set a number to limit
    #     capabilities: ["gpu"]
    networks:
      - ai-network
    
    runtime: nvidia 
    # # GPU configuration - comment out if no NVIDIA GPU available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
        limits:
          memory: 16G
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ['1'] 
    #           capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Neo4j Graph Database
  neo4j:
    image: docker.arvancloud.ir/neo4j:5.15-community
    container_name: ai-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/Mohsen1105$
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Mohsen1105$", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-network

  # n8n Workflow Automation
  n8n:
    image: docker.arvancloud.ir/n8nio/n8n
    container_name: ai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}

      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

      # Neo4j connection variables (optional, for convenience)
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=your-password-here
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - ai-network

volumes:
  open-webui-data:
  chroma-data:
  redis-data:
  shared-data:
  ollama_models:
  n8n-data:
  postgres_storage:
  neo4j-data:
  neo4j-logs:

networks:
  ai-network:
    driver: bridge

