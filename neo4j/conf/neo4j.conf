# Neo4j Configuration File
# For more information, see the neo4j.conf man page
# https://neo4j.com/docs/operations-manual/current/reference/configuration-settings/

# Default network interface and port bindings
#server.default_listen_address=0.0.0.0
server.default_advertised_address=localhost

# Bolt connector configuration
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687
server.bolt.advertised_address=localhost:7687

# HTTP connector configuration
server.http.enabled=true
server.http.listen_address=0.0.0.0:7474
server.http.advertised_address=localhost:7474

# HTTPS connector configuration
server.https.enabled=false

# Memory settings (set via environment variables)
# server.memory.heap.initial_size=512m
# server.memory.heap.max_size=2g
# server.memory.pagecache.size=512m

# Security settings
dbms.security.procedures.unrestricted=apoc.*
dbms.security.auth_enabled=true

# APOC plugin settings
apoc.export.file.enabled=true
apoc.import.file.enabled=true
apoc.trigger.enabled=true
apoc.uuid.enabled=true

# Query logging
#server.logs.query.enabled=true
#server.logs.query.parameter_logging_enabled=false
#server.logs.query.threshold=0

# Strict mode disabled for plugin compatibility
server.config.strict_validation.enabled=false

# Database specific settings
# Max parallel transactions
server.bolt.outgoing_buffer_size=32K

# Keep connections alive
server.bolt.connection_keep_alive_probes=10

# Extended log files path
# server.directories.logs=/var/lib/neo4j/logs
